# marketplace database helper
---
- name: Install MySQL
  include_tasks:
    file: mysql.yml
  when: database == 'mysql'

- name: Install MariaDB
  include_tasks:
    file: mariadb.yml
  when: database == 'mariadb'

- name: Install postgresql
  include_tasks:	
    file: postgresql.yml	
  when: database == 'postgresql'	

- name: Install redis
  include_tasks:
    file: redis.yml
  when: database == 'redis'
