---
# apps/linode_helpers/roles/certbot_ssl/tasks/apache-certbot.yml
- name: Install python3-certbot-apache
  apt:
    name: python3-certbot-apache
    state: present

- name: Set certbot plugin
  set_fact:
    certbot_plugin: apache
    cacheable: yes

- name: Installing let's encrypt certificate on subdomain provided via UDF
  shell:
    cmd: "certbot -n --apache --agree-tos --redirect -d {{ subdomain }}.{{ domain }} -m {{ soa_email_address }}"
  when: 
    - domain is defined
    - subdomain != 'www'

- name: Installing let's encrypt certificate on tld and default subdomain provided via UDF
  shell: 
    cmd: "certbot -n --apache --agree-tos --redirect -d {{ domain }} -d {{ subdomain }}.{{ domain }} -m {{ soa_email_address }}"
  when:
    - domain is defined
    - subdomain == 'www'

- name: Installing let's encrypt certificate on default domain
  shell:
    cmd: "certbot -n --apache --agree-tos --redirect -d {{ default_dns }} -m {{ soa_email_address }}"
  when: default_dns is defined
